name: AIA CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-product-check:
    name: Windows 11 product checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked development environment
        run: uv sync --locked --dev

      - name: Check source formatting boundaries
        shell: pwsh
        run: git diff --check

      - name: Compile the shipped Python source
        run: python -m compileall -q src scripts

      - name: Run the complete test suite
        run: uv run pytest -ra

      - name: Run the product Core self-test
        run: uv run aia self-test --json
