name: AIA CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -ra

      - name: Check package build
        run: uv build

      - name: Check release bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "aia-release"
          pwsh -NoProfile -File .\scripts\package-release.ps1 -OutputRoot $output
