name: AIA Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-windows-package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pyproject = Get-Content .\pyproject.toml -Raw
          $match = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "pyproject.toml version not found" }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $match.Groups[1].Value) {
            throw "Git tag version $tagVersion does not match pyproject version $($match.Groups[1].Value)"
          }

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run full pytest before signed packaging
        run: uv run pytest -ra

      - name: Verify public source export before signed packaging
        shell: pwsh
        run: |
          $publicRoot = Join-Path $env:RUNNER_TEMP "aia-public-source"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\export-public-tree.ps1 `
            -OutputPath $publicRoot -Force

      - name: Materialize signing certificate
        shell: pwsh
        env:
          AIA_SIGNING_CERT_BASE64: ${{ secrets.AIA_SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIA_SIGNING_CERT_BASE64)) {
            throw "AIA_SIGNING_CERT_BASE64 secret is required for a signed Windows release."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "aia-release-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:AIA_SIGNING_CERT_BASE64))
          "AIA_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Windows installer
        shell: pwsh
        env:
          AIA_SIGNING_CERT_PASSWORD: ${{ secrets.AIA_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIA_SIGNING_CERT_PASSWORD)) {
            throw "AIA_SIGNING_CERT_PASSWORD secret is required for a signed PFX release."
          }
          pwsh -NoProfile -File .\scripts\package-windows.ps1 `
            -Clean `
            -CertificatePath $env:AIA_CERTIFICATE_PATH `
            -RequireSignature `
            -SignRuntimeBinaries

      - name: Verify signed Windows package
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verify-windows-package.ps1 -RequireSignature -RequireNativeSignature

      - name: Smoke test signed AIA desktop
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\windows-smoke.ps1 -RequireSignature -RequireNativeSignature

      - name: Smoke test signed Windows installer
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\windows-installer-smoke.ps1 -RequireSignature -RequireNativeSignature

      - name: Upload signed Windows package
        uses: actions/upload-artifact@v4
        with:
          name: aia-windows-signed-${{ github.ref_name }}
          path: dist/windows
          if-no-files-found: error
          retention-days: 30
