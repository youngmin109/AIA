        <strong style="font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums;">1</strong>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 24px; border: 1px solid transparent; background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)) padding-box, linear-gradient(150deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0.2)) border-box; backdrop-filter: blur({{blur}}px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);">
        <span style="color: rgba(255, 255, 255, 0.75); font-size: 14px; font-weight: 600;">감시 중 프로세스</span>

      <div style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 24px; border: 1px solid transparent; background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)) padding-box, linear-gradient(150deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0.2)) border-box; backdrop-filter: blur({{blur}}px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);">
        <span style="color: rgba(255, 255, 255, 0.75); font-size: 14px; font-weight: 600;">파일 변경</span>
        <strong style="font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums;">12</strong>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 24px; border: 1px solid transparent; background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)) padding-box, linear-gradient(150deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0.2)) border-box; backdrop-filter: blur({{blur}}px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);">
        <span style="color: rgba(255, 255, 255, 0.75); font-size: 14px; font-weight: 600;">최근 5분 활동</span>

<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"enum","options":["보라","남색","청록"],"default":"보라"},"blur":{"editor":"range","min":8,"max":40,"step":2,"unit":"px","default":24},"refract":{"editor":"range","min":0,"max":120,"step":5,"unit":"px","default":70},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  lensVals() {
    // 굴절은 이 화면의 강조 카드 하나에만 쓴다. 0이면 기존 유리(blur)와 같다. Chromium 계열(Chrome·Edge·WebView2)에서만 보인다.
    const blur = this.props.blur ?? 24;
    const refract = this.props.refract ?? 70;
    const on = refract > 0;
    const sphere = { '보라': ['#ff9ad6', '#e04bb0', '#5a1580'], '남색': ['#9fd0ff', '#3c7bff', '#142a80'], '청록': ['#a8ffe6', '#2fd6c2', '#0b4a48'] };
    const [a, b, c] = sphere[this.props.tint] ?? sphere['보라'];
    return {
      lensR: refract,
      lensG: refract * 0.94,
      lensB: refract * 0.88,
      rimBlur: Math.max(1.5, blur * 0.12),
      orbShow: on ? 'block' : 'none',
      orbA: `radial-gradient(circle at 30% 26%, #ffffff 0%, ${a} 20%, ${b} 58%, ${c} 100%)`,
      glass_panel: on ? 'url(#aia-lens-panel)' : `blur(${blur}px)`,
    };
  }
  renderVals() {
    const themes = {
      '보라': { bg: 'radial-gradient(circle at 12% 8%, #5a23b8 0%, rgba(90,35,184,0) 42%), radial-gradient(circle at 88% 18%, #a42d8f 0%, rgba(164,45,143,0) 40%), radial-gradient(circle at 55% 100%, #2a3fb0 0%, rgba(42,63,176,0) 50%), linear-gradient(160deg, #1d0d4d, #0f0a2e)', blobA: '#7b4dff', blobB: '#ff4fb0', accent: 'linear-gradient(145deg, #a98bff, #6a3cff)', button: 'linear-gradient(150deg, #ff7ad1 0%, #a35bff 45%, #5b7dff 100%)' },
      '남색': { bg: 'radial-gradient(circle at 12% 8%, #2346b8 0%, rgba(35,70,184,0) 42%), radial-gradient(circle at 88% 18%, #5b2db0 0%, rgba(91,45,176,0) 40%), radial-gradient(circle at 55% 100%, #1d6fb0 0%, rgba(29,111,176,0) 50%), linear-gradient(160deg, #0f1a4d, #0a0f2e)', blobA: '#4d7bff', blobB: '#8b5bff', accent: 'linear-gradient(145deg, #8bb0ff, #3c62ff)', button: 'linear-gradient(150deg, #7ad0ff 0%, #5b7dff 50%, #7a4dff 100%)' },
      '청록': { bg: 'radial-gradient(circle at 12% 8%, #13797a 0%, rgba(19,121,122,0) 42%), radial-gradient(circle at 88% 18%, #2357a8 0%, rgba(35,87,168,0) 40%), radial-gradient(circle at 55% 100%, #136f5a 0%, rgba(19,111,90,0) 50%), linear-gradient(160deg, #0b2a3a, #071a24)', blobA: '#2fd6c2', blobB: '#3c8bff', accent: 'linear-gradient(145deg, #8affe0, #1fb39a)', button: 'linear-gradient(150deg, #8affd8 0%, #2fc8a0 45%, #2f7dff 100%)' },
    };
    const t = themes[this.props.tint] ?? themes['보라'];
    const series = [[2, 0, 0], [3, 1, 0], [1, 0, 0], [4, 2, 0], [2, 1, 0], [5, 0, 0], [3, 3, 0], [2, 0, 1], [4, 2, 0], [3, 1, 0], [6, 2, 0], [2, 0, 0]];
    const pct = (n) => (n === 0 ? '0%' : `${Math.round((n / 9) * 100)}%`);
    return {
      ...t, ...this.lensVals(),
      blur: this.props.blur ?? 24,
      bars: series.map(([allowed, files, blocked]) => ({ allowed: pct(allowed), files: pct(files), blocked: pct(blocked) })),
    };
  }
}
</script>
