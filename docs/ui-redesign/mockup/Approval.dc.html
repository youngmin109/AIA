<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"enum","options":["보라","남색","청록"],"default":"보라"},"blur":{"editor":"range","min":8,"max":40,"step":2,"unit":"px","default":24},"refract":{"editor":"range","min":0,"max":120,"step":5,"unit":"px","default":70},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  lensVals() {
    // 굴절은 이 화면의 강조 카드 하나에만 쓴다. 0이면 기존 유리(blur)와 같다. Chromium 계열(Chrome·Edge·WebView2)에서만 보인다.
    const blur = this.props.blur ?? 24;
    const refract = this.props.refract ?? 70;
    const on = refract > 0;
    const sphere = { '보라': ['#ff9ad6', '#e04bb0', '#5a1580'], '남색': ['#9fd0ff', '#3c7bff', '#142a80'], '청록': ['#a8ffe6', '#2fd6c2', '#0b4a48'] };
    const [a, b, c] = sphere[this.props.tint] ?? sphere['보라'];
    return {
      lensR: refract,
      lensG: refract * 0.94,
      lensB: refract * 0.88,
      rimBlur: Math.max(1.5, blur * 0.12),
      orbShow: on ? 'block' : 'none',
      orbA: `radial-gradient(circle at 30% 26%, #ffffff 0%, ${a} 20%, ${b} 58%, ${c} 100%)`,
      glass_dialog: on ? 'url(#aia-lens-dialog)' : `blur(${blur}px)`,
    };
  }
  renderVals() {
    const themes = {
      '보라': { bg: 'radial-gradient(circle at 12% 8%, #5a23b8 0%, rgba(90,35,184,0) 42%), radial-gradient(circle at 88% 18%, #a42d8f 0%, rgba(164,45,143,0) 40%), radial-gradient(circle at 55% 100%, #2a3fb0 0%, rgba(42,63,176,0) 50%), linear-gradient(160deg, #1d0d4d, #0f0a2e)', blobA: '#7b4dff', button: 'linear-gradient(150deg, #ff7ad1 0%, #a35bff 45%, #5b7dff 100%)' },
      '남색': { bg: 'radial-gradient(circle at 12% 8%, #2346b8 0%, rgba(35,70,184,0) 42%), radial-gradient(circle at 88% 18%, #5b2db0 0%, rgba(91,45,176,0) 40%), radial-gradient(circle at 55% 100%, #1d6fb0 0%, rgba(29,111,176,0) 50%), linear-gradient(160deg, #0f1a4d, #0a0f2e)', blobA: '#4d7bff', button: 'linear-gradient(150deg, #7ad0ff 0%, #5b7dff 50%, #7a4dff 100%)' },
      '청록': { bg: 'radial-gradient(circle at 12% 8%, #13797a 0%, rgba(19,121,122,0) 42%), radial-gradient(circle at 88% 18%, #2357a8 0%, rgba(35,87,168,0) 40%), radial-gradient(circle at 55% 100%, #136f5a 0%, rgba(19,111,90,0) 50%), linear-gradient(160deg, #0b2a3a, #071a24)', blobA: '#2fd6c2', button: 'linear-gradient(150deg, #8affd8 0%, #2fc8a0 45%, #2f7dff 100%)' },
    };
    const t = themes[this.props.tint] ?? themes['보라'];
    return { ...t, ...this.lensVals(), blur: this.props.blur ?? 24 };
  }
}
