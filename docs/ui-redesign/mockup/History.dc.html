  <main style="position: relative; flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 26px clamp(16px, 3vw, 40px) 30px;">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;">기록</h1>
        <span style="color: rgba(255, 255, 255, 0.75); font-size: 15px;">지금까지 보호한 실행 6건</span>
      </div>
      <div role="group" aria-label="기록 필터" style="display: flex; gap: 6px; padding: 5px; border-radius: 18px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); backdrop-filter: blur({{blur}}px);">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 42px; padding: 0 16px; border: 0; border-radius: 13px; background: {{f.fill}}; box-shadow: {{f.shadow}}; color: #ffffff; font: inherit; font-size: 14px; font-weight: {{f.weight}}; cursor: pointer;">{{f.label}} <span style="opacity: 0.7;">{{f.count}}</span></button>

    <section aria-label="요약" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 14px;">

        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(145deg, #ff9aa8, #ff4d6a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);"></span>
        <span style="display: flex; flex-direction: column;"><strong style="font-size: 26px;">3</strong><span style="color: rgba(255, 255, 255, 0.72); font-size: 13px;">막은 위험 행동</span></span>

      <div style="display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); background: linear-gradient(160deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)); backdrop-filter: blur({{blur}}px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(145deg, #8affd8, #2fc8a0); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);"></span>
        <span style="display: flex; flex-direction: column;"><strong style="font-size: 26px;">47</strong><span style="color: rgba(255, 255, 255, 0.72); font-size: 13px;">기록한 파일 변경</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2); background: linear-gradient(160deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)); backdrop-filter: blur({{blur}}px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(145deg, #8fb3ff, #5a5cff); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);"></span>
        <span style="display: flex; flex-direction: column;"><strong style="font-size: 26px;">1</strong><span style="color: rgba(255, 255, 255, 0.72); font-size: 13px;">되돌린 실행</span></span>
      </div>
    </section>

    <section aria-label="실행 목록" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 28px; border: 1px solid transparent; background: linear-gradient(140deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)) padding-box, linear-gradient(140deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.3)) border-box; backdrop-filter: blur({{blur}}px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);">
      <sc-for list="{{runs}}" as="r" hint-placeholder-count="6">
        <a href="Result.dc.html" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; min-height: 64px; padding: 12px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; text-decoration: none;">

          <span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <strong style="font-size: 16px;">{{r.name}}</strong>

          </span>
          <span style="flex: 1 1 200px; display: flex; flex-wrap: wrap; gap: 6px;">

          <span style="flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; background: {{r.pillFill}}; border: 1px solid {{r.pillLine}}; color: {{r.pillText}}; font-size: 13px; font-weight: 800;">{{r.verdict}}</span>

<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"enum","options":["보라","남색","청록"],"default":"보라"},"blur":{"editor":"range","min":8,"max":40,"step":2,"unit":"px","default":24},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const themes = {
      '보라': { bg: 'radial-gradient(circle at 12% 8%, #5a23b8 0%, rgba(90,35,184,0) 42%), radial-gradient(circle at 88% 18%, #a42d8f 0%, rgba(164,45,143,0) 40%), radial-gradient(circle at 55% 100%, #2a3fb0 0%, rgba(42,63,176,0) 50%), linear-gradient(160deg, #1d0d4d, #0f0a2e)', blobA: '#7b4dff', blobB: '#ff4fb0', accent: 'linear-gradient(145deg, #a98bff, #6a3cff)' },
      '남색': { bg: 'radial-gradient(circle at 12% 8%, #2346b8 0%, rgba(35,70,184,0) 42%), radial-gradient(circle at 88% 18%, #5b2db0 0%, rgba(91,45,176,0) 40%), radial-gradient(circle at 55% 100%, #1d6fb0 0%, rgba(29,111,176,0) 50%), linear-gradient(160deg, #0f1a4d, #0a0f2e)', blobA: '#4d7bff', blobB: '#8b5bff', accent: 'linear-gradient(145deg, #8bb0ff, #3c62ff)' },
      '청록': { bg: 'radial-gradient(circle at 12% 8%, #13797a 0%, rgba(19,121,122,0) 42%), radial-gradient(circle at 88% 18%, #2357a8 0%, rgba(35,87,168,0) 40%), radial-gradient(circle at 55% 100%, #136f5a 0%, rgba(19,111,90,0) 50%), linear-gradient(160deg, #0b2a3a, #071a24)', blobA: '#2fd6c2', blobB: '#3c8bff', accent: 'linear-gradient(145deg, #8affe0, #1fb39a)' },
    };
    const t = themes[this.props.tint] ?? themes['보라'];
    const block = { fill: 'rgba(255, 77, 106, 0.2)', color: '#ffd2d8' };
    const file = { fill: 'rgba(255, 255, 255, 0.12)', color: '#ffffff' };
    const done = { fill: 'rgba(69, 224, 168, 0.2)', color: '#c4ffe6' };
    const look = { pillFill: 'rgba(255, 200, 96, 0.18)', pillLine: 'rgba(255, 210, 120, 0.5)', pillText: '#ffe2a6', dot: '#ffc860' };
    const ok = { pillFill: 'rgba(69, 224, 168, 0.16)', pillLine: 'rgba(120, 240, 195, 0.45)', pillText: '#c4ffe6', dot: '#45e0a8' };
    const all = [
      { name: 'hanbit-commerce', when: '오늘 14:20', policy: '표준 보호', counts: [{ text: '차단 1', ...block }, { text: '파일 12', ...file }], verdict: '확인 필요', kind: 'check', ...look },
      { name: 'hanbit-commerce', when: '오늘 11:05', policy: '표준 보호', counts: [{ text: '파일 8', ...file }], verdict: '정상', kind: 'ok', ...ok },
      { name: 'campus-portal', when: '어제 17:42', policy: '협업 개발', counts: [{ text: '차단 2', ...block }, { text: '되돌림', ...done }], verdict: '확인 필요', kind: 'check', ...look },
      { name: 'campus-portal', when: '어제 10:18', policy: '협업 개발', counts: [{ text: '파일 15', ...file }], verdict: '정상', kind: 'ok', ...ok },
      { name: 'redline-docs', when: '10월 3일', policy: '관찰 전용', counts: [{ text: '파일 4', ...file }], verdict: '정상', kind: 'ok', ...ok },
      { name: 'redline-docs', when: '10월 2일', policy: '관찰 전용', counts: [{ text: '파일 8', ...file }], verdict: '정상', kind: 'ok', ...ok },
    ];
    const tabs = [
      { id: 'all', label: '전체', count: all.length },
      { id: 'check', label: '확인 필요', count: all.filter((r) => r.kind === 'check').length },
      { id: 'ok', label: '정상', count: all.filter((r) => r.kind === 'ok').length },
    ];
    const filters = tabs.map((f) => {
      const on = this.state.filter === f.id;
      return {
        ...f,
        pressed: on ? 'true' : 'false',
        fill: on ? 'rgba(255, 255, 255, 0.2)' : 'transparent',
        shadow: on ? 'inset 0 1px 0 rgba(255, 255, 255, 0.3)' : 'none',
        weight: on ? 800 : 500,
        pick: () => this.setState({ filter: f.id }),
      };
    });
    const runs = this.state.filter === 'all' ? all : all.filter((r) => r.kind === this.state.filter);
    return { ...t, blur: this.props.blur ?? 24, filters, runs };
  }
}
</script>
