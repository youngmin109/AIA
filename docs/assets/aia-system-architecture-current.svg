  <path d="M1305 582 H1333 Q1350 582 1350 650 H1370" class="arrow"/>
  <path d="M1305 757 H1333 Q1350 757 1350 690 H1370" class="arrow"/>
  <path d="M1590 644 Q1608 644 1608 542 H1626" class="arrow"/>
  <path d="M1590 670 H1626" class="arrow-red"/>
  <path d="M1590 696 Q1608 696 1608 797 H1626" class="arrow-dash"/>

  <path d="M1539 338 V438 Q1539 455 1520 455 H250 Q230 455 230 517" class="arrow-blue"/>
  <text x="905" y="446" text-anchor="middle" class="label">Codex Tool 요청 → PreToolUse Hook → AIA Hook Broker / Adapter</text>
  <path d="M1677 632 V440 Q1677 420 1657 420 H1580 Q1560 420 1560 338" class="arrow-red"/>
  <text x="1682" y="421" class="label">deny</text>

  <text x="58" y="990" class="section">3. 조치 이후 복구·검증·감사 결과를 남김</text>
  <rect x="45" y="1010" width="1710" height="198" rx="20" fill="#ffffff" stroke="#cedbe5" stroke-width="2" filter="url(#shadow)"/>

  <rect x="79" y="1052" width="272" height="112" rx="16" fill="#eef5ff" stroke="#759ac7" stroke-width="2"/>
  <text x="215" y="1084" text-anchor="middle" class="box-title">AIA Control Root</text>
  <text x="215" y="1112" text-anchor="middle" class="box-text">정책 · Checkpoint · Evidence</text>
  <text x="215" y="1139" text-anchor="middle" class="small">Workspace 밖 신뢰 경계</text>

  <rect x="407" y="1052" width="220" height="112" rx="16" fill="#f1eefa" stroke="#8b76b2" stroke-width="2"/>
  <text x="517" y="1084" text-anchor="middle" class="box-title">Enforcement Execution</text>
  <text x="517" y="1112" text-anchor="middle" class="box-text">PreTool deny / Process 종료</text>
  <text x="517" y="1139" text-anchor="middle" class="small">실제 성공 확인 후 기록</text>

  <rect x="685" y="1052" width="205" height="112" rx="16" fill="#fff4df" stroke="#d6a64e" stroke-width="2"/>
  <text x="787" y="1084" text-anchor="middle" class="box-title">Recovery</text>
  <text x="787" y="1112" text-anchor="middle" class="box-text">유효 Checkpoint 복원</text>
  <text x="787" y="1139" text-anchor="middle" class="small">RESTORED ≠ 검증 완료</text>

  <rect x="947" y="1052" width="205" height="112" rx="16" fill="#e8f6ed" stroke="#65a977" stroke-width="2"/>
  <text x="1049" y="1084" text-anchor="middle" class="box-title">Integrity</text>
  <text x="1049" y="1112" text-anchor="middle" class="box-text">Path + SHA-256 비교</text>
  <text x="1049" y="1139" text-anchor="middle" class="small">VERIFIED / FAILED</text>

  <rect x="1209" y="1052" width="205" height="112" rx="16" fill="#e3f4ef" stroke="#4d9f87" stroke-width="2"/>
  <text x="1311" y="1084" text-anchor="middle" class="box-title">Audit</text>
  <text x="1311" y="1112" text-anchor="middle" class="box-text">결정과 근거 연결</text>
  <text x="1311" y="1139" text-anchor="middle" class="small">Evidence lineage 보존</text>

  <rect x="1472" y="1040" width="245" height="136" rx="18" fill="#173f5f" stroke="#102a43" stroke-width="2"/>
  <text x="1594" y="1075" text-anchor="middle" class="white-title">Result Bundle</text>
  <text x="1594" y="1103" text-anchor="middle" class="white-text">result.json · audit.jsonl</text>
  <text x="1594" y="1128" text-anchor="middle" class="white-text">security-report.md</text>
  <text x="1594" y="1153" text-anchor="middle" class="white-text">Bundle 무결성 VALID</text>

