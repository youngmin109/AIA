<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">AIA 현재 시스템 설계도</title>
  <desc id="desc">사용자 진입점부터 보호 실행 준비, 실제 Codex, 증거 수집, 정책 평가와 귀속, 강제조치, 복구, 무결성 검증, 감사 결과까지의 현재 AIA 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#1f4b68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#58758b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1677a8"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#c2413a"/>
    </marker>
    <style>
      .title { font: 700 42px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #fff; }
      .subtitle { font: 400 20px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #d9e8f2; }
      .section { font: 700 24px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #183b56; }
      .box-title { font: 700 20px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #16324f; }
      .box-text { font: 400 16px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #425466; }
      .small { font: 400 14px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #5d7184; }
      .white-title { font: 700 20px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #fff; }
      .white-text { font: 400 15px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #eaf4fa; }
      .label { font: 700 15px "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #466477; }
      .state { font: 700 16px "Consolas", "Malgun Gothic", monospace; fill: #20435d; }
      .arrow { fill: none; stroke: #58758b; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #1677a8; stroke-width: 3.2; marker-end: url(#arrowBlue); }
      .arrow-red { fill: none; stroke: #c2413a; stroke-width: 3.2; marker-end: url(#arrowRed); }
      .arrow-dash { fill: none; stroke: #7d93a5; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="url(#bg)"/>
  <rect width="1800" height="118" fill="url(#header)"/>
  <text x="62" y="58" class="title">AIA 현재 시스템 설계도</text>
  <text x="64" y="91" class="subtitle">Windows 11 · Codex CLI · 보호 실행 MVP + 로컬 보안 콘솔(P1)</text>
  <rect x="1410" y="28" width="325" height="60" rx="15" fill="#2b6687" opacity="0.95"/>
  <text x="1572" y="53" text-anchor="middle" class="white-title">현재 실제 검증</text>
  <text x="1572" y="76" text-anchor="middle" class="white-text">Bash PreToolUse 사전 차단</text>

  <text x="58" y="158" class="section">1. 사용자가 보호 실행을 시작</text>
  <rect x="45" y="178" width="1710" height="195" rx="20" fill="#ffffff" stroke="#cedbe5" stroke-width="2" filter="url(#shadow)"/>

  <rect x="76" y="224" width="170" height="102" rx="17" fill="#e8f2f9" stroke="#99bfd7" stroke-width="2"/>
  <text x="161" y="258" text-anchor="middle" class="box-title">사용자</text>
  <text x="161" y="286" text-anchor="middle" class="box-text">보호할 Workspace</text>
  <text x="161" y="309" text-anchor="middle" class="box-text">작업 요청 입력</text>

  <rect x="300" y="199" width="230" height="68" rx="14" fill="#f0f7fb" stroke="#83b6d2" stroke-width="2"/>
  <text x="415" y="229" text-anchor="middle" class="box-title">CLI</text>
  <text x="415" y="252" text-anchor="middle" class="small">aia protect ...</text>
  <rect x="300" y="284" width="230" height="68" rx="14" fill="#f0f7fb" stroke="#83b6d2" stroke-width="2"/>
  <text x="415" y="313" text-anchor="middle" class="box-title">로컬 보안 콘솔</text>
  <text x="415" y="338" text-anchor="middle" class="small">127.0.0.1:8787</text>

  <rect x="590" y="214" width="230" height="124" rx="17" fill="#dceef8" stroke="#4f9ec4" stroke-width="2.5"/>
  <text x="705" y="250" text-anchor="middle" class="box-title">실행 조정 서비스</text>
  <text x="705" y="279" text-anchor="middle" class="box-text">RunApplicationService</text>
  <text x="705" y="305" text-anchor="middle" class="small">Session 생명주기 조정</text>

  <rect x="875" y="194" width="430" height="164" rx="18" fill="#eef5ff" stroke="#759ac7" stroke-width="2.5"/>
  <text x="1090" y="224" text-anchor="middle" class="box-title">보호 실행 준비</text>
  <rect x="897" y="242" width="185" height="43" rx="10" fill="#fff" stroke="#adc3dc"/>
  <text x="989" y="270" text-anchor="middle" class="box-text">Session + 정책 고정</text>
  <rect x="1098" y="242" width="185" height="43" rx="10" fill="#fff" stroke="#adc3dc"/>
  <text x="1190" y="270" text-anchor="middle" class="box-text">Workspace Lease</text>
  <rect x="897" y="298" width="185" height="43" rx="10" fill="#fff" stroke="#adc3dc"/>
  <text x="989" y="326" text-anchor="middle" class="box-text">Safe Checkpoint</text>
  <rect x="1098" y="298" width="185" height="43" rx="10" fill="#fff" stroke="#adc3dc"/>
  <text x="1190" y="326" text-anchor="middle" class="box-text">Readiness Barrier</text>

  <rect x="1372" y="214" width="335" height="124" rx="17" fill="#6650a4" stroke="#4c3885" stroke-width="2.5"/>
  <text x="1539" y="250" text-anchor="middle" class="white-title">Protected Launcher</text>
  <text x="1539" y="280" text-anchor="middle" class="white-text">실제 Codex CLI 실행</text>
  <text x="1539" y="306" text-anchor="middle" class="white-text">Session/Process Identity 결합</text>

  <path d="M246 275 H300" class="arrow"/>
  <path d="M530 233 H560 Q575 233 575 248 V260 Q575 276 590 276" class="arrow"/>
  <path d="M530 318 H560 Q575 318 575 302 V292 Q575 276 590 276" class="arrow"/>
  <path d="M820 276 H875" class="arrow"/>
  <path d="M1305 276 H1372" class="arrow"/>

  <rect x="735" y="378" width="370" height="38" rx="19" fill="#d9e8f2"/>
  <text x="920" y="403" text-anchor="middle" class="state">PREPARING → READY → RUNNING → 종료</text>

  <text x="58" y="455" class="section">2. 실제 Codex 행위를 관찰하고 판단</text>
  <rect x="45" y="475" width="1710" height="450" rx="20" fill="#ffffff" stroke="#cedbe5" stroke-width="2" filter="url(#shadow)"/>

  <rect x="78" y="517" width="225" height="333" rx="18" fill="#eff9f6" stroke="#79b7a4" stroke-width="2"/>
  <text x="190" y="551" text-anchor="middle" class="box-title">Runtime Evidence</text>
  <text x="190" y="577" text-anchor="middle" class="small">관찰 사실만 수집</text>
  <rect x="98" y="602" width="185" height="58" rx="12" fill="#fff" stroke="#94c8b8"/>
  <text x="190" y="626" text-anchor="middle" class="box-text">Codex PreToolUse</text>
  <text x="190" y="648" text-anchor="middle" class="small">Hook / Command</text>
  <rect x="98" y="678" width="185" height="58" rx="12" fill="#fff" stroke="#94c8b8"/>
  <text x="190" y="713" text-anchor="middle" class="box-text">Filesystem Sensor</text>
  <rect x="98" y="754" width="185" height="58" rx="12" fill="#fff" stroke="#94c8b8"/>
  <text x="190" y="789" text-anchor="middle" class="box-text">Process Sensor</text>

  <rect x="346" y="613" width="200" height="114" rx="16" fill="#e3f4ef" stroke="#4d9f87" stroke-width="2.3"/>
  <text x="446" y="650" text-anchor="middle" class="box-title">Raw Evidence</text>
  <text x="446" y="678" text-anchor="middle" class="box-text">append-only</text>
  <text x="446" y="703" text-anchor="middle" class="small">원본 ID · 시각 · 출처</text>

  <rect x="590" y="613" width="190" height="114" rx="16" fill="#eaf3fb" stroke="#669dcc" stroke-width="2.3"/>
  <text x="685" y="650" text-anchor="middle" class="box-title">Normalization</text>
  <text x="685" y="680" text-anchor="middle" class="box-text">표현 통일</text>
  <text x="685" y="704" text-anchor="middle" class="small">센서별 형식 정리</text>

  <rect x="824" y="613" width="205" height="114" rx="16" fill="#dfeefa" stroke="#4d8fc0" stroke-width="2.3"/>
  <text x="926" y="650" text-anchor="middle" class="box-title">Canonical Action</text>
  <text x="926" y="680" text-anchor="middle" class="box-text">표준 행위</text>
  <text x="926" y="704" text-anchor="middle" class="small">operation · path · command</text>

  <rect x="1085" y="525" width="220" height="114" rx="16" fill="#fff4df" stroke="#d6a64e" stroke-width="2.3"/>
  <text x="1195" y="562" text-anchor="middle" class="box-title">Policy Evaluation</text>
  <text x="1195" y="592" text-anchor="middle" class="box-text">정책 위반인가?</text>
  <text x="1195" y="616" text-anchor="middle" class="small">동결된 Active Policy</text>

  <rect x="1085" y="700" width="220" height="114" rx="16" fill="#f3eefe" stroke="#9a77c8" stroke-width="2.3"/>
  <text x="1195" y="737" text-anchor="middle" class="box-title">Attribution</text>
  <text x="1195" y="767" text-anchor="middle" class="box-text">Agent 행위인가?</text>
  <text x="1195" y="791" text-anchor="middle" class="small">EXACT / PROCESS / TEMPORAL</text>

  <rect x="1370" y="613" width="220" height="114" rx="16" fill="#feecec" stroke="#d76861" stroke-width="2.5"/>
  <text x="1480" y="650" text-anchor="middle" class="box-title">Enforcement Gate</text>
  <text x="1480" y="680" text-anchor="middle" class="box-text">CONTINUE / CONTAIN</text>
  <text x="1480" y="704" text-anchor="middle" class="small">또는 REFUSE</text>

  <rect x="1626" y="505" width="102" height="74" rx="13" fill="#e8f6ed" stroke="#65a977" stroke-width="2"/>
  <text x="1677" y="536" text-anchor="middle" class="box-title">허용</text>
  <text x="1677" y="560" text-anchor="middle" class="small">실행 계속</text>
  <rect x="1626" y="632" width="102" height="74" rx="13" fill="#fde7e6" stroke="#c2413a" stroke-width="2"/>
  <text x="1677" y="662" text-anchor="middle" class="box-title">차단</text>
  <text x="1677" y="687" text-anchor="middle" class="small">BLOCKED</text>
  <rect x="1626" y="760" width="102" height="74" rx="13" fill="#f1f3f5" stroke="#8996a3" stroke-width="2"/>
  <text x="1677" y="790" text-anchor="middle" class="box-title">보류</text>
  <text x="1677" y="815" text-anchor="middle" class="small">사용자 검토</text>

  <path d="M303 670 H346" class="arrow"/>
  <path d="M546 670 H590" class="arrow"/>
  <path d="M780 670 H824" class="arrow"/>
  <path d="M1029 658 Q1055 658 1055 582 H1085" class="arrow"/>
