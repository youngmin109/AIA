  <rect x="45" y="1224" width="1710" height="38" rx="12" fill="#dbe6ee"/>
  <text x="900" y="1249" text-anchor="middle" class="label">핵심 계약: Policy Violation alone ≠ Kill · 자동 통제는 EXACT 근거 필요 · Rollback 후 Integrity Verification 필수</text>
</svg>
