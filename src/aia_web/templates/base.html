<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <title>{% block title %}AIA 보호 콘솔{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=alpha2c">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <a class="brand" href="/" aria-label="AIA 대시보드">
        <span class="brand-mark">A</span><span class="brand-name">AIA</span>
      </a>
      <p class="sidebar-caption">보호 작업공간</p>
      <nav class="sidebar-nav">
        <a class="{% if request.url.path in ['/', '/dashboard'] %}is-active{% endif %}" href="/">
          <span class="nav-icon" aria-hidden="true">▦</span><span>대시보드</span>
        </a>
        <a class="{% if request.url.path == '/new' %}is-active{% endif %}" href="/new">
          <span class="nav-icon" aria-hidden="true">＋</span><span>새 보호 실행</span>
        </a>
        <a class="{% if request.url.path == '/runs' %}is-active{% endif %}" href="/runs">
          <span class="nav-icon" aria-hidden="true">◷</span><span>실행 기록</span>
        </a>
        {% if session_id %}
        <a class="{% if request.url.path == '/runs/' ~ session_id %}is-active{% endif %}" href="/runs/{{ session_id }}">
          <span class="nav-icon" aria-hidden="true">◉</span><span>현재 실행</span>
        </a>
        {% endif %}
      </nav>
      <div class="sidebar-note">
        <span class="status-dot dot-verified"></span>
        <span>로컬 보호 콘솔</span>
      </div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-context">
          <span class="topbar-kicker">AIA · AGENT INTEGRITY ASSURANCE</span>
          <span class="topbar-title">실행을 확인하고, 근거를 보여드립니다</span>
        </div>
        <span class="local-chip"><span class="status-dot dot-verified"></span>이 기기에서 실행 중</span>
      </header>
      <main class="page-shell">
        {% block content %}{% endblock %}
      </main>
      <footer class="footer">AIA Core가 보안 판단을 수행합니다 · 콘솔은 로컬 전용입니다</footer>
    </div>
  </div>
</body>
</html>
