<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AIA Local Security Console{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=workbench-ui-20">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">A</span><span>AIA</span><small>로컬 보안 콘솔</small></div>
    {% set current_path = request.url.path %}
    <nav aria-label="AIA 주요 메뉴">
      <a class="{{ 'is-active' if current_path in ['/', '/dashboard'] else '' }}"{% if current_path in ['/', '/dashboard'] %} aria-current="page"{% endif %} href="/">대시보드</a>
      <a class="{{ 'is-active' if current_path == '/new' else '' }}"{% if current_path == '/new' %} aria-current="page"{% endif %} href="/new">새 보호 실행</a>
      <a class="{{ 'is-active' if current_path == '/runs' else '' }}"{% if current_path == '/runs' %} aria-current="page"{% endif %} href="/runs">실행 기록</a>
      {% if session_id %}<a class="{{ 'is-active' if is_workbench else '' }}"{% if is_workbench %} aria-current="page"{% endif %} href="{% if is_workbench %}/runs/{{ session_id }}/workbench{% else %}/runs/{{ session_id }}{% endif %}">{% if is_workbench %}현재 Workbench{% else %}현재 실행{% endif %}</a>{% endif %}
    </nav>
  </header>
  <main class="page-shell{% if is_workbench %} page-shell-workbench{% endif %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">로컬 전용 콘솔 · 보안 판단 권한은 AIA Core에 있습니다</footer>
</body>
</html>
