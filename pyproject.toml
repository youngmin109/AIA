[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aia-mvp"
version = "0.1.23"
description = "Protected execution and evidence product for Codex agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "psutil==7.2.2",
    "uvicorn==0.52.4",
    "watchdog==6.0.0",
]

[project.scripts]
aia = "aia.cli:main"
aia-web = "aia_web.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]
evaluation = [
    "plotly>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aia", "src/aia_app", "src/aia_web"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/evaluation",
    "/.tmp-build",
    "/aia-functional-architecture.png",
    "/aia-system-architecture.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
