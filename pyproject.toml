[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aia-mvp"
version = "1.0.0"
description = "Runtime assurance for AI coding agents: protected Codex runs with pre-execution policy checks, evidence and restore"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "AIA Project" }]
keywords = ["ai-agent", "codex", "runtime-security", "zero-trust", "policy", "audit", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "psutil==7.2.2",
    "pywebview>=5.4,<7",
    "pywinpty==3.0.5",
    "uvicorn==0.52.4",
    "watchdog==6.0.0",
    "websockets==15.0.1",
]

[project.urls]
Repository = "https://github.com/youngmin109/AIA"
Issues = "https://github.com/youngmin109/AIA/issues"
Changelog = "https://github.com/youngmin109/AIA/blob/main/CHANGELOG.md"

[project.scripts]
aia = "aia.cli:main"
aia-web = "aia_web.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11,<7",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]
evaluation = [
    "plotly>=6.0",
]

[tool.hatch.build]
# `npm run build` writes the React console into this gitignored folder.
# Hatch leaves VCS-ignored files out of the sdist, and `uv build` makes the
# wheel from that sdist, so ship the built console explicitly.
artifacts = ["src/aia_web/static/app/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/aia", "src/aia_app", "src/aia_desktop", "src/aia_web"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/evaluation",
    "/.tmp-build",
    "/docs/assets/aia-functional-architecture.png",
    "/docs/assets/aia-system-architecture.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Run without installing anything: uvx ruff@0.15.0 check
[tool.ruff]
target-version = "py313"
extend-exclude = ["evaluation", "frontend", "dist", ".tmp-build", "tmp"]

[tool.ruff.lint]
# Only checks that find real mistakes (unused names, undefined names, syntax
# errors). Formatting follows the surrounding code instead of a style rule.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures and then name them as parameters.
"tests/**" = ["F401", "F811"]
# Smoke, benchmark and evaluation scripts keep intermediate results for reading.
"scripts/**" = ["F841"]
